services:
  refactory:
    build: .
    profiles: ["sqlite"]
    volumes:
      - refactory-data:/data
      - .:/app/workspace:ro
    environment:
      - REFACTORY_DB_URL=sqlite:////data/refactory.db
    working_dir: /app/workspace

  refactory-pg:
    build: .
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app/workspace:ro
    environment:
      - REFACTORY_DB_URL=postgresql://refactory:refactory@postgres:5432/refactory
    working_dir: /app/workspace

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: refactory
      POSTGRES_PASSWORD: refactory
      POSTGRES_DB: refactory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refactory"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    profiles: ["migrate"]
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - REFACTORY_DB_URL=postgresql://refactory:refactory@postgres:5432/refactory

volumes:
  refactory-data:
  postgres-data:
